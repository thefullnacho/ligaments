name: wikilint

# Runs the conflict linter on every push and PR, plus weekly, because drift
# accumulates on a calendar rather than on commits.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 13 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repos the wiki describes. Cross-repo CI is the hard part: this is
      # the simplest shape that works, and it needs a token that can see them.
      # - uses: actions/checkout@v4
      #   with:
      #     repository: your-org/service-a
      #     path: repos/service-a
      #     token: ${{ secrets.WIKILINT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python3 -m unittest discover -s lint -v

      # This repo publishes the schema and the linter, not a wiki, and a real
      # wikilint.json points at local paths so it is gitignored. In a wiki repo
      # that ships a config, this step runs and is the whole point.
      - name: Lint the wiki against its repos
        if: hashFiles('wikilint.json') != ''
        run: python3 lint/wikilint.py -c wikilint.json --fail-on error

      - name: No wiki config, lint skipped
        if: hashFiles('wikilint.json') == ''
        run: |
          echo "No wikilint.json in this repo, so there is no wiki to lint here."
          echo "The unit tests above exercise every check against synthetic fixtures."
          echo "Copy lint/wikilint.example.json to wikilint.json in your own wiki repo."
